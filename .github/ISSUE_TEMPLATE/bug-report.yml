name: Bug report
description: Report reproducible extension or UI behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account records, private screenshots, or security vulnerabilities.
  - type: input
    id: version
    attributes: {label: Version, placeholder: "0.2.8"}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: dropdown
    id: browser
    attributes: {label: Browser, options: [Chrome, Edge, Other Chromium browser]}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private and account information.
          required: true
