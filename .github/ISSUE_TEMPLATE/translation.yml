name: Translation contribution
description: Propose or correct a translation without changing formula meaning.
title: "[Translation]: "
labels: [translation, documentation]
body:
  - type: input
    id: language
    attributes: {label: Language and locale}
    validations: {required: true}
  - type: textarea
    id: location
    attributes: {label: Exact file, indicator, and text location}
    validations: {required: true}
  - type: textarea
    id: proposed
    attributes: {label: Proposed wording and rationale}
    validations: {required: true}
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: This is my original translation and is not copied from a proprietary source.
          required: true
